<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications – PeriodWise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
      padding: 20px;
    }
    h2 {
      color: #e91e63;
      text-align: center;
    }
    .notice {
      background: #f9f9f9;
      border-left: 4px solid #e91e63;
      padding: 15px;
      margin: 15px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Updates</h2>

<div id="updatesList"></div>

<script>
  fetch('https://www.periodwise.online/updates.json?ts=' + Date.now())
    .then(response => response.json())
    .then(data => {
      const updatesList = document.getElementById('updatesList');
      if (data.items && data.items.length > 0) {
        data.items.forEach(item => {
          const updateElement = document.createElement('div');
          updateElement.classList.add('notice');
          updateElement.onclick = () => window.open(item.url, '_blank');
          updateElement.innerHTML = `📝 ${item.title}`;
          updatesList.appendChild(updateElement);
        });
      } else {
        updatesList.innerHTML = "<p>No updates available.</p>";
      }
    })
    .catch(e => {
      console.error('Failed to load updates:', e);
      const updatesList = document.getElementById('updatesList');
      updatesList.innerHTML = "<p>Error loading updates.</p>";
    });
</script>

</body>
</html>
