<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure PIN</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #f8bbd0, #ffffff);
  }

  .lock-card {
    background: #ffffff;
    padding: 30px 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    width: 320px;
    text-align: center;
  }

  h2 {
    margin-bottom: 20px;
    color: #e91e63;
    font-weight: 600;
  }

  input[type="password"] {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    letter-spacing: 8px;
    text-align: center;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 15px;
    transition: 0.3s;
  }

  input[type="password"]:focus {
    border-color: #e91e63;
    outline: none;
    box-shadow: 0 0 5px rgba(233,30,99,0.5);
  }

  button {
    width: 100%;
    padding: 12px;
    background-color: #e91e63;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #d81b60;
  }

  .secondary-btn {
    margin-top: 10px;
    background: transparent;
    color: #e91e63;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  .error {
    color: red;
    margin-top: 8px;
    min-height: 18px;
  }
</style>
</head>
<body>

<div class="lock-card">
  <h2 id="pw-title"></h2>
  <input type="password" id="pw-input" maxlength="4" placeholder="●●●●">
  <button id="pw-btn"></button>
  <button class="secondary-btn" id="pw-forgot">Forgot PIN?</button>
  <p id="pw-error" class="error"></p>
</div>

<script>
 (function() {
  const PIN_KEY = "userPIN";
  const title = document.getElementById("pw-title");
  const input = document.getElementById("pw-input");
  const btn = document.getElementById("pw-btn");
  const error = document.getElementById("pw-error");
  const forgot = document.getElementById("pw-forgot");

  const storedPIN = localStorage.getItem(PIN_KEY);

  if (!storedPIN) {
    // First-time: create PIN
    title.textContent = "Create a 4-digit PIN";
    btn.textContent = "Set PIN";

    btn.addEventListener("click", () => {
      const val = input.value;
      if (val.length !== 4 || isNaN(val)) {
        error.textContent = "PIN must be 4 digits";
        return;
      }
      localStorage.setItem(PIN_KEY, val);

      // Automatically switch to Unlock mode
      input.value = "";
      error.textContent = "";
      title.textContent = "Enter your PIN";
      btn.textContent = "Unlock";

      // Replace old click handler with unlock handler
      btn.replaceWith(btn.cloneNode(true)); // remove old listener
      const newBtn = document.getElementById("pw-btn");

      newBtn.addEventListener("click", () => {
        const entered = input.value;
        const stored = localStorage.getItem(PIN_KEY);
        if (entered === stored) {
          sessionStorage.setItem("unlocked", "true");
          window.location.href = "index.html";
        } else {
          error.textContent = "Incorrect PIN";
          input.value = "";
        }
      });
    });

    forgot.style.display = "none";

  } else {
    // PIN exists: prompt entry
    title.textContent = "Enter your PIN";
    btn.textContent = "Unlock";

    btn.addEventListener("click", () => {
      const val = input.value;
      if (val === storedPIN) {
        sessionStorage.setItem("unlocked", "true");
        window.location.href = "index.html";
      } else {
        error.textContent = "Incorrect PIN";
        input.value = "";
      }
    });

    forgot.addEventListener("click", () => {
      alert("Forgot PIN feature coming soon.");
    });
  }
})();
</script>

</body>
</html>
