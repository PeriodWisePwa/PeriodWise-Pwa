<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cycle Tracker</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #fafafa;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

label {
  display: flex;
  justify-content: space-between;
  margin: 8px 0;
}

.score {
  font-size: 28px;
  font-weight: bold;
  color: #ff4d6d;
}
</style>
</head>

<body>

<div class="card">
<h2>Today’s Insight</h2>
<p id="dailyInsightText">Loading insight…</p>
</div>

<div class="card">
<h2>Cycle Coach</h2>
<p id="coachText">Loading guidance…</p>
</div>

<div class="card">
<h2>Cycle Health Score</h2>
<div class="score" id="healthScore">--</div>
</div>

<div class="card">
<h2>Daily Check-In</h2>

<label>Cramps <input type="checkbox" id="symptom_cramps"></label>
<label>Bloating <input type="checkbox" id="symptom_bloating"></label>
<label>Headache <input type="checkbox" id="symptom_headache"></label>

<button onclick="saveCheckin()">Save Check-In</button>
</div>

<div class="card">
<h2>Mood</h2>
<select id="moodSelect">
<option value="">Select mood</option>
<option>Happy</option>
<option>Calm</option>
<option>Low</option>
<option>Irritable</option>
<option>Emotional</option>
</select>
</div>

<script>

// ---------- SETTINGS ----------
const avgCycle = parseInt(localStorage.getItem("pw_avgCycle") || 28);
const periodLength = parseInt(localStorage.getItem("pw_periodLength") || 5);
const lastPeriod = new Date(localStorage.getItem("pw_lastPeriod") || new Date());

// ---------- CALCULATE DAY ----------
const today = new Date();
const diff = Math.floor((today - lastPeriod) / 86400000);
const cycleDay = ((diff % avgCycle) + avgCycle) % avgCycle + 1;
const ovulationDay = avgCycle - 14;

// ---------- LOAD CHECKIN ----------
const key = today.toISOString().slice(0,10);
const checkin = JSON.parse(localStorage.getItem("pw_checkin_"+key) || "{}");

// ---------- SMART INSIGHT ----------
function getInsight() {

 let msg = "";

 if(cycleDay <= periodLength) {
   msg = "🩸 You're on your period. Prioritize rest and hydration.";
 }
 else if(cycleDay <= ovulationDay - 5) {
   msg = "🌿 Energy rising — great time for focus and planning.";
 }
 else if(cycleDay >= ovulationDay - 2 && cycleDay <= ovulationDay + 1) {
   msg = "🔥 Ovulation window — confidence and energy may peak.";
 }
 else if(cycleDay <= avgCycle - 5) {
   msg = "⚡ Luteal phase — take things gently and listen to your body.";
 }
 else {
   msg = "💛 Period approaching — prepare and track PMS symptoms.";
 }

 const daysToPeriod = avgCycle - cycleDay;
 if(daysToPeriod <= 5 && cycleDay > periodLength) {
   msg += ` Your period expected in ${daysToPeriod} day(s).`;
 }

 if(checkin.cramps) msg += " Cramps logged — consider warmth.";
 if(checkin.bloating) msg += " Bloating noted — hydrate.";
 if(checkin.headache) msg += " Headache — rest recommended.";

 return msg;
}

// ---------- COACH ----------
function getCoach() {

 if(cycleDay <= periodLength) {
   return "Coach: Slow down, nourish your body, reduce stress.";
 }

 if(cycleDay <= ovulationDay) {
   return "Coach: Use your rising energy — tackle important tasks.";
 }

 if(cycleDay > ovulationDay) {
   return "Coach: Be gentle, prioritize sleep and emotional care.";
 }

}

// ---------- HEALTH SCORE ----------
function calculateScore() {

 let score = 100;

 if(checkin.cramps) score -= 10;
 if(checkin.bloating) score -= 5;
 if(checkin.headache) score -= 5;

 return score;
}

// ---------- SAVE CHECKIN ----------
function saveCheckin() {

 const data = {
   cramps: document.getElementById("symptom_cramps").checked,
   bloating: document.getElementById("symptom_bloating").checked,
   headache: document.getElementById("symptom_headache").checked,
   mood: document.getElementById("moodSelect").value
 };

 localStorage.setItem("pw_checkin_"+key, JSON.stringify(data));

 // update streak
 let streak = parseInt(localStorage.getItem("pw_streak") || 0);
 streak++;
 localStorage.setItem("pw_streak", streak);

 alert("Saved!");
 location.reload();
}

// ---------- RENDER ----------
document.getElementById("dailyInsightText").innerText = getInsight();
document.getElementById("coachText").innerText = getCoach();
document.getElementById("healthScore").innerText = calculateScore();

</script>

</body>
</html>
