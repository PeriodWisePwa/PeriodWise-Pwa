<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PeriodWise</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e91e63">

<style>
body { font-family: Arial, sans-serif; padding: 16px; text-align: center; }
h1 { color: #e91e63; }

input, button, select, textarea {
  padding: 10px;
  margin: 6px;
  width: 90%;
  max-width: 320px;
}

button {
  background: #e91e63;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* Floating share */
#shareBtn {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 9999;
  background:#ff4d6d;
  border-radius:20px;
  padding:8px 14px;
}

/* Calendar */
.calendar-header, .calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

.day {
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
}

.period { background:#f8bbd0; }
.high { background:#f44336;color:white;}
.medium { background:#ffeb3b;}
.low { background:#c8e6c9;}
.today { border:2px solid black;font-weight:bold;}

/* Banner */
#movingBanner {
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  background:#fff3f8;
  color:#e91e63;
  padding:8px 0;
  font-weight:bold;
  margin-bottom:16px;
}

#movingBanner span {
  display:inline-block;
  padding-left:100%;
  animation:scrollText 12s linear infinite;
}

@keyframes scrollText {
  0% { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}

/* Panels */
.panel {
  max-width:600px;
  margin:15px auto;
  padding:12px;
  border-radius:10px;
  background:#fff3f8;
  text-align:left;
}
</style>
</head>

<body>

<button id="shareBtn" onclick="shareApp()">📤 Share</button>

<h1>PeriodWise</h1>

<div id="movingBanner">
<span>⚠️ Learn how to understand your cycle better → periodwise.online</span>
</div>

<p>Private • Offline • No tracking</p>

<!-- INPUT -->
<div id="inputSection">
<input id="lastPeriodDate" type="date">
<input id="cycles" placeholder="Cycles e.g 26,27,26">
<input id="periodLength" type="number" placeholder="Period length (5)">
<button onclick="handleSubmit()">Save & Show Calendar</button>
</div>

<p id="warning"></p>

<!-- CALENDAR -->
<div id="calendarSection" style="display:none;">
<div>
<button onclick="changeMonth(-1)">◀</button>
<strong id="monthTitle"></strong>
<button onclick="changeMonth(1)">▶</button>
</div>

<div class="calendar-header">
<div>Mon</div><div>Tue</div><div>Wed</div>
<div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
</div>

 <div class="calendar" id="calendar"></div>
<!-- Legend goes here -->
<div class="legend">
  <div class="legend-item"><span class="legend-box period"></span> Period</div>
  <div class="legend-item"><span class="legend-box high"></span> High</div>
  <div class="legend-item"><span class="legend-box medium"></span> Medium</div>
  <div class="legend-item"><span class="legend-box low"></span> Low</div>
</div>

<p id="confidenceText"></p>
<button onclick="resetInput()">Re-enter Cycle</button>
</div>

<!-- HABIT LOOP -->
<div class="panel">
<strong>🔥 Check-In Streak:</strong> <span id="streakCount">0</span> days
<p id="habitMessage"></p>
</div>

<!-- INSIGHTS -->
<div class="panel">
<h4>Your Insights</h4>
<p id="monthlyInsight"></p>
<p id="cycleTip"></p>
<p id="badge"></p>
</div>

<!-- DAILY CHECKIN -->
<div class="panel" id="dailyCheckin">
<h3>Daily Cycle Check-In</h3>

<select id="mood">
<option value="">Mood</option>
<option>😄 Happy</option>
<option>😴 Tired</option>
<option>🤕 Crampy</option>
<option>😠 Irritable</option>
</select>

<label><input type="checkbox" id="symptom_cramps"> Cramps</label>
<label><input type="checkbox" id="symptom_bloating"> Bloating</label>
<label><input type="checkbox" id="symptom_headache"> Headache</label>

<textarea id="note" placeholder="Notes"></textarea>

<button onclick="saveCheckin()">Save Check-In</button>
<p id="checkinMsg"></p>
</div>

<!-- FOOTER -->
<div style="margin-top:40px;font-size:12px;color:#666;">
<a href="privacy.html">Privacy Policy</a> •
<a href="disclaimer.html">Disclaimer</a> •
<a href="https://www.periodwise.online/p/periodwise-app-frequently-asked.html">FAQ</a>
</div>

<script>

let monthOffset = 0;

function normalize(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function handleSubmit(){
const last=document.getElementById("lastPeriodDate").value;
const cycles=document.getElementById("cycles").value;
const len=document.getElementById("periodLength").value||5;

if(!last||!cycles){ warning.innerText="Enter data"; return;}

localStorage.setItem("pw_lastPeriod",last);
localStorage.setItem("pw_cycles",cycles);
localStorage.setItem("pw_periodLength",len);

renderCalendar();
}

function changeMonth(step){ monthOffset+=step; renderCalendar(); }

function resetInput(){
localStorage.clear();
location.reload();
}

 function renderCalendar(){

const last = normalize(new Date(localStorage.getItem("pw_lastPeriod")));
const cycles = localStorage.getItem("pw_cycles").split(",").map(Number);
const len = +localStorage.getItem("pw_periodLength") || 5;

const avg = Math.round(cycles.reduce((a,b)=>a+b)/cycles.length);

const ovulationDay = avg - 14;

const base = new Date();
base.setDate(1);
base.setMonth(base.getMonth() + monthOffset);

monthTitle.innerText = base.toLocaleString("default",{month:"long",year:"numeric"});

calendar.innerHTML = "";
calendarSection.style.display = "block";
inputSection.style.display = "none";

const first = new Date(base.getFullYear(), base.getMonth(), 1);
const offset = (first.getDay() + 6) % 7;
const days = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();

const today = normalize(new Date());

for(let i=0;i<offset;i++) calendar.appendChild(document.createElement("div"));

for(let d=1; d<=days; d++){

const date = normalize(new Date(base.getFullYear(), base.getMonth(), d));

const diff = Math.floor((date - last)/86400000);
const cycleDay = ((diff % avg) + avg) % avg + 1;

const el = document.createElement("div");
el.className = "day";
el.textContent = d;

if(cycleDay <= len){
  el.classList.add("period");
}
else if(cycleDay >= ovulationDay - 1 && cycleDay <= ovulationDay + 1){
  el.classList.add("high");
}
else if(cycleDay >= ovulationDay - 5 && cycleDay <= ovulationDay + 3){
  el.classList.add("medium");
}
else{
  el.classList.add("low");
}

if(date.getTime() === today.getTime()){
  el.classList.add("today");
}

calendar.appendChild(el);
}

confidenceText.innerText = "Prediction confidence: High";

}

updateInsights();
}

function shareApp(){
if(navigator.share){
navigator.share({title:"PeriodWise",url:location.href});
}else alert("Copy link to share");
}

function saveCheckin(){
const key=new Date().toISOString().slice(0,10);
const data={
mood:mood.value,
cramps:symptom_cramps.checked,
bloating:symptom_bloating.checked,
headache:symptom_headache.checked,
note:note.value
};
localStorage.setItem("pw_checkin_"+key,JSON.stringify(data));

updateStreak();
updateInsights();

checkinMsg.innerText="Saved!";
}

function updateStreak(){
const today=new Date().toISOString().slice(0,10);
const last=localStorage.getItem("pw_last_checkin");
let streak=parseInt(localStorage.getItem("pw_streak")||"0");

const yesterday=new Date();
yesterday.setDate(yesterday.getDate()-1);
const yKey=yesterday.toISOString().slice(0,10);

if(last===yKey) streak++;
else if(last!==today) streak=1;

localStorage.setItem("pw_last_checkin",today);
localStorage.setItem("pw_streak",streak);

streakCount.innerText=streak;

const msgs=["Consistency builds insight 💛","You're doing great 🌿","Keep tracking 🙌"];
habitMessage.innerText=msgs[Math.floor(Math.random()*msgs.length)];
}

function updateInsights(){
const month=new Date().toISOString().slice(0,7);
let count=0;

for(let i=0;i<localStorage.length;i++){
const k=localStorage.key(i);
if(k.startsWith("pw_checkin_") && k.includes(month)) count++;
}

monthlyInsight.innerText=`You logged ${count} days this month`;

const streak=parseInt(localStorage.getItem("pw_streak")||"0");

if(streak>=30) badge.innerText="🏆 30-Day Champion";
else if(streak>=7) badge.innerText="🌟 7-Day Streak";
else badge.innerText="";
}

window.addEventListener("load",()=>{
if(localStorage.getItem("pw_lastPeriod")) renderCalendar();
updateStreak();
updateInsights();
});

if('serviceWorker' in navigator){
navigator.serviceWorker.register('./service-worker.js');
}

</script>

</body>
</html>
